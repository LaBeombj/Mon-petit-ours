<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para mi DuDu</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Georgia, serif;
      background: linear-gradient(160deg, #fac8c7, #efb0ad 55%, #cb8c84);
      color: #7d1715;
    }

    body.paused *,
    body.paused *::before,
    body.paused *::after {
      animation-play-state: paused !important;
      transition: none !important;
    }

    header {
      padding: 28px 20px 10px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-family: "Brush Script MT", cursive;
      font-size: clamp(42px, 8vw, 76px);
      font-weight: normal;
      color: #86130f;
      text-shadow: 2px 2px 0 #f8d0c8;
    }

    .heart {
      display: inline-block;
      color: #ed1d35;
      font-family: Arial, sans-serif;
      font-size: 0.8em;
      transform: rotate(-8deg);
      text-shadow: 2px 2px #4c170f;
    }

    .pause-button {
      position: fixed;
      z-index: 10;
      top: 22px;
      right: 24px;
      border: 0;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #b91e18;
      color: white;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 10px #76201688;
    }

    main {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 72vh;
      padding: 25px 15px 60px;
    }

    .box-area {
      position: relative;
      width: min(90vw, 420px);
      height: 390px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .box {
      position: relative;
      width: 280px;
      height: 280px;
      filter: drop-shadow(12px 15px 8px #4b211a66);
      transition: transform 0.4s ease;
    }

    .box:hover {
      transform: translateY(-5px);
    }

    .tray {
      position: absolute;
      left: 20px;
      bottom: 18px;
      width: 240px;
      height: 155px;
      padding: 18px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      background: #32180d;
      border: 8px solid #563021;
      box-shadow: inset 0 0 0 3px #17100c;
      z-index: 1;
    }

    .lid {
      position: absolute;
      left: 20px;
      top: 40px;
      z-index: 4;
      width: 240px;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #d52a18;
      border: 8px solid #77291b;
      box-shadow: 8px 8px 0 #4a2d20;
      cursor: pointer;
      transform-origin: left bottom;
      transition: transform 0.9s ease, opacity 0.5s ease;
    }

    .lid::before,
    .lid::after {
      content: "";
      position: absolute;
      width: 30px;
      height: 30px;
      border-color: #ffe8d7;
      border-style: solid;
    }

    .lid::before {
      top: 7px;
      left: 7px;
      border-width: 7px 0 0 7px;
    }

    .lid::after {
      right: 7px;
      bottom: 7px;
      border-width: 0 7px 7px 0;
    }

    .lid-text {
      padding: 18px 28px;
      border: 2px solid #ffab96;
      color: #fff5e9;
      font-family: "Brush Script MT", cursive;
      font-size: 28px;
      text-align: center;
    }

    .box.open .lid {
      transform: translateY(-125px) rotate(-9deg);
      opacity: 0.98;
    }

    .chocolate {
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 0;
      border-radius: 50%;
      width: 82px;
      height: 52px;
      cursor: pointer;
      background: #8e351d;
      box-shadow: inset -5px -6px 0 #542114,
                  2px 4px 4px #130d0a;
      transition: transform 0.25s ease;
    }

    .chocolate:hover {
      transform: scale(1.12);
    }

    .chocolate::after {
      content: "";
      width: 58px;
      height: 7px;
      border-radius: 50%;
      background: #f9dcb4;
      transform: rotate(-18deg);
      box-shadow: 0 12px 0 #f9dcb4;
    }

    .chocolate.heart-shape {
      background: #d82820;
      border-radius: 50% 50% 45% 45%;
      transform: rotate(-45deg);
    }

    .chocolate.heart-shape::before,
    .chocolate.heart-shape::after {
      content: "";
      position: absolute;
      width: 42px;
      height: 42px;
      background: #d82820;
      border-radius: 50%;
      top: -18px;
    }

    .chocolate.heart-shape::before {
      left: 0;
    }

    .chocolate.heart-shape::after {
      left: 22px;
    }

    .chocolate.heart-shape:hover {
      transform: rotate(-45deg) scale(1.12);
    }

    .chocolate span {
      position: absolute;
      bottom: -38px;
      left: 50%;
      z-index: 8;
      width: max-content;
      max-width: 150px;
      padding: 8px 12px;
      border-radius: 12px;
      background: #fff0d9;
      color: #633628;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%);
      box-shadow: 0 3px 8px #55201455;
      transition: opacity 0.2s ease;
    }

    .chocolate:hover span {
      opacity: 1;
    }

    .instruction {
      position: absolute;
      bottom: 0;
      width: 100%;
      text-align: center;
      color: #791711;
      font-style: italic;
    }

    .close-box {
      display: block;
      margin: 24px auto 0;
      padding: 10px 18px;
      border: 0;
      border-radius: 20px;
      background: #fff0d9;
      color: #78150f;
      font-style: italic;
      cursor: pointer;
    }

    .modal {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background: #260d0dcc;
    }

    .modal.show {
      display: flex;
      animation: fadeIn 0.3s ease;
    }

    .card {
      position: relative;
      width: min(92vw, 360px);
      padding: 28px 24px 24px;
      text-align: center;
      color: white;
      border: 3px solid #f35d6c;
      border-radius: 22px;
      background: linear-gradient(150deg, #d81d36, #a50a18);
      box-shadow: 0 10px 30px #19050799;
      animation: cardIn 0.4s ease;
    }

    .card h2 {
      margin: 0 0 12px;
      font-family: "Brush Script MT", cursive;
      font-size: 42px;
      font-weight: normal;
    }

    .card p {
      margin: 0 auto 16px;
      max-width: 270px;
      color: #fff3e9;
      font-weight: bold;
      line-height: 1.5;
      font-size: 14px;
    }

    .card img {
      display: block;
      width: 190px;
      height: 165px;
      object-fit: cover;
      margin: 0 auto 18px;
      border-radius: 8px;
      background: #fff1e8;
    }

    .modal-close {
      padding: 9px 26px;
      border: 0;
      border-radius: 18px;
      background: #fff7f2;
      color: #8d1720;
      font-weight: bold;
      cursor: pointer;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: scale(0.8) translateY(20px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @media (max-width: 480px) {
      .box-area {
        transform: scale(0.83);
        margin: -30px 0;
      }

      .pause-button {
        top: 15px;
        right: 15px;
      }
    }
  </style>
</head>

<body>
<audio id="miMusica"loop>
<source src="Nothing's Gonna Stop Us Now - Starship.mp3" type="audio/mpeg">
</audio>

  <button class="pause-button" id="pauseButton" aria-label="Pausar animaciones">
    ❚❚
  </button>

  <header>
    <h1>Para mi DuDu <span class="heart">❤</span></h1>
  </header>

  <main>
    <section class="box-area">
      <div class="box" id="chocolateBox">
        <div class="tray">
          <button class="chocolate heart-shape" data-message="0">
            <span>Trufa de Chocolate</span>
          </button>

          <button class="chocolate" data-message="1">
            <span>Chocolate Blanco</span>
          </button>

          <button class="chocolate" data-message="2">
            <span>Chocolate con Leche</span>
          </button>

          <button class="chocolate heart-shape" data-message="3">
            <span>Trufa Especial</span>
          </button>
        </div>

        <button class="lid" id="lidButton">
          <span class="lid-text">Click aquí</span>
        </button>
      </div>

      <div class="instruction">
        Abre la caja y descubre una sorpresa
        <button class="close-box" id="closeBox">Cerrar caja</button>
      </div>
    </section>
  </main>

  <div class="modal" id="modal">
    <article class="card">
      <h2 id="modalTitle"></h2>
      <p id="modalText"></p>
      <img id="modalImage" src="" alt="Ilustración romántica">
      <button class="modal-close" id="modalClose">Cerrar</button>
    </article>
  </div>

  <script>
    const box = document.getElementById("chocolateBox");
    const lidButton = document.getElementById("lidButton");
    const closeBox = document.getElementById("closeBox");
    const pauseButton = document.getElementById("pauseButton");
    const musica = document.getElementById("miMusica");

    const modal = document.getElementById("modal");
    const modalTitle = document.getElementById("modalTitle");
    const modalText = document.getElementById("modalText");
    const modalImage = document.getElementById("modalImage");
    const modalClose = document.getElementById("modalClose");

    const messages = [
      {
        title: "Dulce refugio",
        text: "El amor que me das es puro e intenso, como un buen chocolate.",
        image: "images/imagen1.jpg"
      },
      {
        title: "Calidez",
        text: "Tu ternura me ilumina y me cuida, tan suave y dulce como el chocolate blanco.",
        image: "images/imagen2.jpg"
      },
      {
        title: "Abrazo",
        text: "Estar contigo es reconfortante y alegre, como un sorbito de chocolate con leche.",
        image: "images/imagen3.jpg"
      },
      {
        title: "Mi favorito",
        text: "Tú eres mi trufa especial, el detalle más único y delicioso de mi vida.",
        image: "images/imagen4.jpg"
      }
    ];

    lidButton.addEventListener("click", () => {
      box.classList.add("open");
      musica.play();
    });

    closeBox.addEventListener("click", () => {
      box.classList.remove("open");
    });

    pauseButton.addEventListener("click", () => {
      document.body.classList.toggle("paused");

      if (document.body.classList.contains("paused")) {
        pauseButton.textContent = "▶";
        pauseButton.setAttribute("aria-label", "Reanudar animaciones");
      } else {
        pauseButton.textContent = "❚❚";
        pauseButton.setAttribute("aria-label", "Pausar animaciones");
      }
    });

    document.querySelectorAll(".chocolate").forEach((chocolate) => {
      chocolate.addEventListener("click", () => {
        const message = messages[chocolate.dataset.message];

        modalTitle.textContent = message.title;
        modalText.textContent = message.text;
        modalImage.src = message.image;
        modal.classList.add("show");
      });
    });

    function closeModal() {
      modal.classList.remove("show");
    }

    modalClose.addEventListener("click", closeModal);

    modal.addEventListener("click", (event) => {
      if (event.target === modal) {
        closeModal();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeModal();
      }
    });
  </script>
</body>
</html>
